<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduHub - My Profile</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: linear-gradient(180deg, #312e81, #4f46e5);
            color: white;
            padding: 25px 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            padding: 10px 15px 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 13px 15px;
            margin: 6px 0;
            border-radius: 9px;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.15);
        }

        .sidebar .active {
            background: rgba(255,255,255,0.2);
        }

        .main-content {
            margin-left: 250px;
            padding: 40px;
        }

        .profile-page {
            max-width: 1000px;
            margin: auto;
        }

        .back-btn {
            display: inline-block;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .profile-header h1 {
            margin: 0 0 8px;
            color: #312e81;
        }

        .profile-header p {
            margin: 0;
            color: #666;
        }

        .profile-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .info-box {
            background: #f5f7fb;
            padding: 18px;
            border-radius: 12px;
        }

        .info-box span {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .info-box strong {
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .stat-icon {
            font-size: 30px;
        }

        .stat-card h2 {
            color: #4f46e5;
            margin: 8px 0;
            font-size: 32px;
        }

        .stat-card p {
            color: #666;
            margin: 0;
        }

        @media (max-width: 700px) {

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .sidebar a {
                display: inline-block;
                margin: 3px;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .profile-info {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }

    </style>

</head>

<body>

    <div class="sidebar">

        <div class="logo">
            🎓 EduHub
        </div>

        <a href="index.html">
            🏠 Home
        </a>

        <a href="index.html">
            🛍️ Available Products
        </a>

        <a href="messages.html">
            💬 Messages
        </a>

        <a href="index.html">
            ➕ Sell Your Product
        </a>

        <a href="history.html">
            🧾 Transaction History
        </a>

        <a href="profile.html" class="active">
            👤 My Profile
        </a>

        <a href="login.html">
            🔐 Login
        </a>

    </div>


    <div class="main-content">

        <div class="profile-page">

            <a href="index.html" class="back-btn">
                ← Back to EduHub
            </a>


            <div class="profile-card">

                <div class="profile-header">

                    <div class="profile-avatar">
                        👤
                    </div>

                    <div>

                        <h1 id="profileName">
                            Student
                        </h1>

                        <p id="profileEmail">
                            Loading...
                        </p>

                    </div>

                </div>


                <div class="profile-info">

                    <div class="info-box">

                        <span>
                            Full Name
                        </span>

                        <strong id="infoName">
                            -
                        </strong>

                    </div>


                    <div class="info-box">

                        <span>
                            Email
                        </span>

                        <strong id="infoEmail">
                            -
                        </strong>

                    </div>


                    <div class="info-box">

                        <span>
                            Account Type
                        </span>

                        <strong>
                            EduHub Student
                        </strong>

                    </div>


                    <div class="info-box">

                        <span>
                            Platform
                        </span>

                        <strong>
                            College Marketplace
                        </strong>

                    </div>

                </div>

            </div>


            <div class="stats">

                <div class="stat-card">

                    <div class="stat-icon">
                        📦
                    </div>

                    <h2 id="productCount">
                        0
                    </h2>

                    <p>
                        Products Listed
                    </p>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        🧾
                    </div>

                    <h2 id="transactionCount">
                        0
                    </h2>

                    <p>
                        Transactions
                    </p>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        💬
                    </div>

                    <h2 id="messageCount">
                        0
                    </h2>

                    <p>
                        Messages
                    </p>

                </div>

            </div>

        </div>

    </div>


    <script>

        const API =
            "https://eduhub-backend-llwi.onrender.com";


        async function loadProfile() {

            const email =
                localStorage.getItem("userEmail");

            const name =
                localStorage.getItem("userName");


            if (email) {

                document.getElementById(
                    "profileEmail"
                ).innerText = email;

                document.getElementById(
                    "infoEmail"
                ).innerText = email;

            } else {

                document.getElementById(
                    "profileEmail"
                ).innerText =
                    "Not logged in";

                document.getElementById(
                    "infoEmail"
                ).innerText =
                    "Not logged in";

            }


            if (name) {

                document.getElementById(
                    "profileName"
                ).innerText = name;

                document.getElementById(
                    "infoName"
                ).innerText = name;

            } else {

                document.getElementById(
                    "profileName"
                ).innerText =
                    "EduHub Student";

                document.getElementById(
                    "infoName"
                ).innerText =
                    "Student";

            }


            if (!email) {
                return;
            }


            try {

                const productsResponse =
                    await fetch(
                        `${API}/api/products`
                    );

                if (productsResponse.ok) {

                    const products =
                        await productsResponse.json();

                    const myProducts =
                        products.filter(
                            product =>
                                String(
                                    product.seller || ""
                                ).toLowerCase()
                                ===
                                email.toLowerCase()
                        );

                    document.getElementById(
                        "productCount"
                    ).innerText =
                        myProducts.length;
                }


                const transactionResponse =
                    await fetch(
                        `${API}/api/transactions`
                    );

                if (transactionResponse.ok) {

                    const transactions =
                        await transactionResponse.json();

                    const myTransactions =
                        transactions.filter(
                            transaction =>
                                String(
                                    transaction.buyer || ""
                                ).toLowerCase()
                                ===
                                email.toLowerCase()
                        );

                    document.getElementById(
                        "transactionCount"
                    ).innerText =
                        myTransactions.length;
                }


                const messageResponse =
                    await fetch(
                        `${API}/api/messages`
                    );

                if (messageResponse.ok) {

                    const messages =
                        await messageResponse.json();

                    const myMessages =
                        messages.filter(
                            message => {

                                const sender =
                                    String(
                                        message.sender || ""
                                    ).toLowerCase();

                                const receiver =
                                    String(
                                        message.receiver || ""
                                    ).toLowerCase();

                                const currentUser =
                                    email.toLowerCase();

                                return (
                                    sender === currentUser ||
                                    receiver === currentUser
                                );
                            }
                        );

                    document.getElementById(
                        "messageCount"
                    ).innerText =
                        myMessages.length;
                }


            } catch (error) {

                console.error(
                    "Profile loading error:",
                    error
                );

            }

        }


        document.addEventListener(
            "DOMContentLoaded",
            loadProfile
        );

    </script>

</body>

</html>
