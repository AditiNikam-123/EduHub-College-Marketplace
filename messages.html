
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduHub - Messages</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;

            color: #222;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            background:
                linear-gradient(
                    135deg,
                    #312e81,
                    #4f46e5
                );

            color: white;

            padding: 22px 40px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

        }


        header h1 {

            margin: 0;

            font-size: 26px;

        }


        .back-btn {

            border: none;

            background: white;

            color: #4f46e5;

            padding:
                10px 18px;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

        }


        .back-btn:hover {

            background: #eef2ff;

        }


        /* =========================
           MAIN
        ========================= */

        .container {

            width: 90%;

            max-width: 1000px;

            margin: 40px auto;

        }


        .heading {

            margin-bottom: 25px;

        }


        .heading h2 {

            margin: 0 0 8px;

            color: #312e81;

            font-size: 32px;

        }


        .heading p {

            margin: 0;

            color: #666;

        }


        /* =========================
           MESSAGE CARD
        ========================= */

        .message-card {

            background: white;

            border-left:
                5px solid #4f46e5;

            border-radius: 14px;

            padding: 22px;

            margin-bottom: 18px;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.08);

        }


        .message-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

        }


        .from {

            font-weight: bold;

            color: #312e81;

        }


        .date {

            font-size: 13px;

            color: #777;

        }


        .product {

            margin-top: 16px;

            color: #4f46e5;

            font-size: 20px;

            font-weight: bold;

        }


        .receiver {

            margin-top: 8px;

            color: #555;

        }


        .message-text {

            margin-top: 15px;

            padding: 15px;

            background: #f3f4f6;

            border-radius: 10px;

            line-height: 1.5;

        }


        /* =========================
           REPLY BUTTON
        ========================= */

        .reply-btn {

            margin-top: 16px;

            border: none;

            background: #4f46e5;

            color: white;

            padding:
                10px 18px;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

        }


        .reply-btn:hover {

            background: #3730a3;

        }


        /* =========================
           EMPTY / ERROR
        ========================= */

        .empty {

            background: white;

            padding: 60px 20px;

            text-align: center;

            border-radius: 14px;

            color: #777;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.06);

        }


        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 25px;

            text-align: center;

            border-radius: 12px;

        }


        /* =========================
           MODAL
        ========================= */

        .modal {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.65);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 9999;

        }


        .modal-box {

            width: 100%;

            max-width: 500px;

            background: white;

            border-radius: 16px;

            padding: 28px;

        }


        .modal-box h2 {

            margin-top: 0;

            color: #312e81;

        }


        .modal-box input,
        .modal-box textarea {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border:
                1px solid #ddd;

            border-radius: 8px;

            font-family: inherit;

        }


        .modal-box textarea {

            height: 120px;

            resize: none;

        }


        .modal-buttons {

            display: flex;

            gap: 10px;

            margin-top: 15px;

        }


        .send-btn,
        .cancel-btn {

            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

        }


        .send-btn {

            background: #4f46e5;

            color: white;

        }


        .cancel-btn {

            background: #e5e7eb;

            color: #222;

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <h1>
            🎓 EduHub
        </h1>


        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back to Marketplace
        </button>

    </header>



    <!-- CONTENT -->

    <main class="container">


        <div class="heading">

            <h2>
                💬 My Messages
            </h2>

            <p>
                View messages from buyers and sellers.
            </p>

        </div>


        <div id="messagesContainer">

            <div class="empty">

                ⏳ Loading messages...

            </div>

        </div>


    </main>



    <script>

        // ======================================
        // LIVE RENDER BACKEND
        // ======================================

        const API =
            "https://eduhub-backend-llwi.onrender.com";


        // ======================================
        // BACK TO MARKETPLACE
        // ======================================

        function goBack() {

            window.location.href =
                "index.html";

        }


        // ======================================
        // LOAD MESSAGES
        // ======================================

        async function loadMessages() {

            const container =
                document.getElementById(
                    "messagesContainer"
                );


            container.innerHTML = `

                <div class="empty">

                    ⏳ Loading messages...

                </div>

            `;


            try {

                const response =
                    await fetch(
                        `${API}/api/messages`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load messages."
                    );

                }


                const messages =
                    await response.json();


                console.log(
                    "Messages received:",
                    messages
                );


                if (
                    !Array.isArray(messages) ||
                    messages.length === 0
                ) {

                    container.innerHTML = `

                        <div class="empty">

                            <h3>
                                💬 No messages yet
                            </h3>

                            <p>
                                Messages sent from the
                                marketplace will appear here.
                            </p>

                        </div>

                    `;

                    return;

                }


                container.innerHTML = "";


                messages
                    .slice()
                    .reverse()
                    .forEach(
                        message => {

                            createMessageCard(
                                message,
                                container
                            );

                        }
                    );


            } catch (error) {

                console.error(
                    "Messages error:",
                    error
                );


                container.innerHTML = `

                    <div class="error">

                        ❌

                        <h3>
                            Unable to connect to EduHub backend
                        </h3>

                        <p>
                            Please try again in a few seconds.
                        </p>

                        <p>
                            Backend:
                            <strong>
                                eduhub-backend-llwi.onrender.com
                            </strong>
                        </p>

                        <button
                            onclick="loadMessages()"
                            style="
                                margin-top:15px;
                                padding:10px 18px;
                                border:none;
                                border-radius:8px;
                                background:#4f46e5;
                                color:white;
                                font-weight:bold;
                                cursor:pointer;
                            "
                        >
                            🔄 Try Again
                        </button>

                    </div>

                `;

            }

        }


        // ======================================
        // CREATE MESSAGE CARD
        // ======================================

        function createMessageCard(
            message,
            container
        ) {

            const productName =
                message.productName ||
                message.product ||
                "General Message";


            const sender =
                message.sender ||
                "Unknown";


            const receiver =
                message.receiver ||
                "Unknown";


            const messageText =
                message.message ||
                "";


            const date =
                message.date ||
                "Date unavailable";


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "message-card";


            card.innerHTML = `

                <div class="message-header">

                    <div class="from">

                        📤 From:
                        ${escapeHTML(sender)}

                    </div>


                    <div class="date">

                        🕒
                        ${escapeHTML(date)}

                    </div>

                </div>


                <div class="product">

                    📚
                    ${escapeHTML(productName)}

                </div>


                <div class="receiver">

                    📥

                    <strong>
                        To:
                    </strong>

                    ${escapeHTML(receiver)}

                </div>


                <div class="message-text">

                    💬
                    ${escapeHTML(messageText)}

                </div>


                <button
                    class="reply-btn"
                    onclick="
                        openReply(
                            '${escapeJS(sender)}',
                            '${escapeJS(productName)}',
                            ${message.productId || "null"},
                            ${message.id || 0}
                        )
                    "
                >

                    ↩️ Reply

                </button>

            `;


            container.appendChild(
                card
            );

        }


        // ======================================
        // OPEN REPLY
        // ======================================

        function openReply(
            receiver,
            productName,
            productId,
            messageId
        ) {

            const old =
                document.getElementById(
                    "replyModal"
                );


            if (old) {

                old.remove();

            }


            const modal =
                document.createElement(
                    "div"
                );


            modal.id =
                "replyModal";


            modal.className =
                "modal";


            modal.innerHTML = `

                <div class="modal-box">

                    <h2>
                        ↩️ Reply to Message
                    </h2>


                    <p>

                        <strong>
                            To:
                        </strong>

                        ${escapeHTML(receiver)}

                    </p>


                    <p>

                        📚

                        ${escapeHTML(productName)}

                    </p>


                    <input
                        id="replySender"
                        type="email"
                        placeholder="Your email"
                    >


                    <textarea
                        id="replyText"
                        placeholder="Write your reply..."
                    ></textarea>


                    <div class="modal-buttons">

                        <button
                            class="send-btn"
                            onclick="
                                sendReply(
                                    '${escapeJS(receiver)}',
                                    '${escapeJS(productName)}',
                                    ${productId || "null"},
                                    ${messageId}
                                )
                            "
                        >

                            📤 Send Reply

                        </button>


                        <button
                            class="cancel-btn"
                            onclick="closeReply()"
                        >

                            Cancel

                        </button>

                    </div>

                </div>

            `;


            document.body.appendChild(
                modal
            );

        }


        // ======================================
        // SEND REPLY
        // ======================================

        async function sendReply(
            receiver,
            productName,
            productId,
            messageId
        ) {

            const senderInput =
                document.getElementById(
                    "replySender"
                );


            const messageInput =
                document.getElementById(
                    "replyText"
                );


            if (!senderInput ||
                !messageInput) {

                alert(
                    "Reply box not found."
                );

                return;

            }


            const sender =
                senderInput.value.trim();


            const message =
                messageInput.value.trim();


            if (!sender) {

                alert(
                    "Please enter your email."
                );

                return;

            }


            if (!sender.includes("@")) {

                alert(
                    "Please enter a valid email."
                );

                return;

            }


            if (!message) {

                alert(
                    "Please write a reply."
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API}/api/messages`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    sender:
                                        sender,

                                    receiver:
                                        receiver,

                                    productId:
                                        productId,

                                    productName:
                                        productName,

                                    message:
                                        message,

                                    replyTo:
                                        messageId

                                })

                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    alert(
                        "❌ " +
                        (
                            result.message ||
                            "Reply failed."
                        )
                    );

                    return;

                }


                alert(
                    "✅ Reply sent successfully!"
                );


                closeReply();


                loadMessages();


            } catch (error) {

                console.error(
                    "Reply error:",
                    error
                );


                alert(
                    "❌ Unable to connect to EduHub backend."
                );

            }

        }


        // ======================================
        // CLOSE REPLY
        // ======================================

        function closeReply() {

            const modal =
                document.getElementById(
                    "replyModal"
                );


            if (modal) {

                modal.remove();

            }

        }


        // ======================================
        // HTML SECURITY
        // ======================================

        function escapeHTML(value) {

            return String(
                value ?? ""
            )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

        }


        function escapeJS(value) {

            return String(
                value ?? ""
            )

            .replace(
                /\\/g,
                "\\\\"
            )

            .replace(
                /'/g,
                "\\'"
            );

        }


        // ======================================
        // START
        // ======================================

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                loadMessages();

            }
        );

    </script>


</body>

</html>
