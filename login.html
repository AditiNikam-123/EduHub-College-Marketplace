```
<div class="login-container">

    <h1>🎓 EduHub</h1>

    <p class="subtitle">
        Login to College Marketplace
    </p>

    <form id="loginForm">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>

    </form>

    <div
        id="message"
        class="message"
    ></div>

    <p class="signup-link">
        Don't have an account?
        <a href="signup.html">
            Sign Up
        </a>
    </p>

    <a
        href="index.html"
        class="back-link"
    >
        ← Back to Marketplace
    </a>

</div>


<script>

    // =========================================
    // LIVE BACKEND
    // =========================================

    const API =
        "https://eduhub-backend-llwi.onrender.com";


    // =========================================
    // LOGIN
    // =========================================

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const button =
                    document
                        .getElementById("loginButton");


                const message =
                    document
                        .getElementById("message");


                message.textContent = "";
                message.className =
                    "message";


                button.disabled = true;

                button.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            `${API}/api/users`
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Backend connection failed"
                        );

                    }


                    const users =
                        await response.json();


                    const user =
                        users.find(
                            u =>
                                String(
                                    u.email
                                ).toLowerCase()
                                ===
                                email.toLowerCase()
                                &&
                                u.password ===
                                password
                        );


                    if (!user) {

                        message.textContent =
                            "❌ Invalid email or password.";

                        message.className =
                            "message error";

                        return;

                    }


                    // =================================
                    // SAVE USER LOGIN
                    // =================================

                    localStorage.setItem(
                        "userEmail",
                        user.email
                    );


                    localStorage.setItem(
                        "userName",
                        user.name || ""
                    );


                    message.textContent =
                        "✅ Login successful!";


                    message.className =
                        "message success";


                    setTimeout(
                        function() {

                            window.location.href =
                                "index.html";

                        },
                        700
                    );


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    message.textContent =
                        "❌ Unable to connect to EduHub backend.";

                    message.className =
                        "message error";


                } finally {

                    button.disabled =
                        false;

                    button.textContent =
                        "Login";

                }

            }
        );

</script>
