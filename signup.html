
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduHub - Sign Up</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #312e81,
                    #4f46e5
                );

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .signup-box {
            background: white;

            padding: 35px 30px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.2);

            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #312e81;
        }

        .subtitle {
            color: #666;
            margin-top: 5px;
        }

        .signup-box h2 {
            color: #333;
            margin-top: 25px;
            margin-bottom: 20px;
        }

        #signupForm {
            display: flex;
            flex-direction: column;
            gap: 13px;
            text-align: left;
        }

        #signupForm input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 14px;

            outline: none;
        }

        #signupForm input:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 2px
                rgba(79,70,229,0.1);
        }

        #signupButton {
            width: 100%;

            border: none;

            background: #4f46e5;

            color: white;

            padding: 13px;

            border-radius: 9px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        #signupButton:hover {
            background: #4338ca;
        }

        #signupButton:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .status-message {
            display: none;

            padding: 11px;

            border-radius: 8px;

            margin-bottom: 15px;

            font-size: 14px;

            text-align: center;
        }

        .status-success {
            display: block;

            background: #dcfce7;

            color: #15803d;
        }

        .status-error {
            display: block;

            background: #fee2e2;

            color: #dc2626;
        }

        .login-text {
            margin-top: 20px;

            color: #666;
        }

        .login-text a {
            color: #4f46e5;

            font-weight: bold;

            text-decoration: none;
        }

        .back-link {
            display: block;

            margin-top: 18px;

            color: #666;

            text-decoration: none;

            font-size: 14px;
        }

        .back-link:hover {
            color: #4f46e5;
        }

    </style>

</head>


<body>


<div class="signup-container">

    <div class="signup-box">


        <div class="logo">
            🎓 EduHub
        </div>


        <div class="subtitle">
            College Marketplace
        </div>


        <h2>
            Create Account
        </h2>


        <!-- STATUS -->

        <div id="statusMessage"
             class="status-message">
        </div>


        <!-- SIGNUP FORM -->

        <form id="signupForm">


            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >


            <input
                type="email"
                id="email"
                placeholder="College Email"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                minlength="6"
                required
            >


            <button
                type="submit"
                id="signupButton"
            >
                Create Account
            </button>


        </form>


        <p class="login-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Marketplace
        </a>


    </div>

</div>



<script>


// ==================================================
// EDUHUB BACKEND
// ==================================================

const API =
    "https://eduhub-backend-llwi.onrender.com";


// ==================================================
// ELEMENTS
// ==================================================

const form =
    document.getElementById("signupForm");

const button =
    document.getElementById("signupButton");

const statusMessage =
    document.getElementById("statusMessage");


// ==================================================
// SHOW MESSAGE
// ==================================================

function showMessage(message, type) {

    statusMessage.innerText = message;

    statusMessage.className =
        "status-message " +
        (
            type === "success"
            ? "status-success"
            : "status-error"
        );
}


// ==================================================
// SIGNUP
// ==================================================

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value
                .trim();


        // ------------------------------------------
        // VALIDATION
        // ------------------------------------------

        if (!name || !email || !password) {

            showMessage(
                "Please fill all fields.",
                "error"
            );

            return;
        }


        if (!email.includes("@")) {

            showMessage(
                "Please enter a valid email.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }


        // ------------------------------------------
        // BUTTON
        // ------------------------------------------

        button.disabled = true;

        button.innerText =
            "Creating Account...";


        // ------------------------------------------
        // BACKEND REQUEST
        // ------------------------------------------

        try {

            const response =
                await fetch(
                    `${API}/api/users`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            name: name,

                            email: email,

                            password: password

                        })
                    }
                );


            const data =
                await response.json();


            console.log(
                "Signup response:",
                data
            );


            // --------------------------------------
            // BACKEND ERROR
            // --------------------------------------

            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Unable to create account.",
                    "error"
                );

                button.disabled = false;

                button.innerText =
                    "Create Account";

                return;
            }


            // --------------------------------------
            // SUCCESS
            // --------------------------------------

            showMessage(
                "✅ Account created successfully! Redirecting to login...",
                "success"
            );


            // Save user's basic information
            localStorage.setItem(
                "userName",
                name
            );

            localStorage.setItem(
                "userEmail",
                email
            );


            // Redirect to login
            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                1200
            );


        } catch (error) {

            console.error(
                "Signup error:",
                error
            );


            showMessage(
                "❌ Unable to connect to EduHub backend.",
                "error"
            );


            button.disabled = false;

            button.innerText =
                "Create Account";

        }

    }
);


</script>


</body>

</html>
