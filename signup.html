
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduHub - Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #312e81,
                #4f46e5
            );
        }

        .signup-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .signup-box {
            background: white;
            padding: 35px 30px;
            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.2);

            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #312e81;
        }

        .subtitle {
            color: #666;
            margin-top: 6px;
        }

        h2 {
            color: #333;
            margin-top: 25px;
        }

        #statusMessage {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #15803d;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #dc2626;
        }

        #signupForm {
            display: flex;
            flex-direction: column;
            gap: 13px;
            text-align: left;
        }

        #signupForm input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 9px;

            font-size: 14px;
            outline: none;
        }

        #signupForm input:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 2px rgba(79,70,229,0.1);
        }

        #signupButton {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 9px;

            background: #4f46e5;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            margin-top: 5px;
        }

        #signupButton:hover {
            background: #4338ca;
        }

        #signupButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-text {
            color: #666;
            margin-top: 20px;
        }

        .login-text a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            display: block;
            margin-top: 18px;

            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #4f46e5;
        }
    </style>
</head>

<body>

<div class="signup-container">

    <div class="signup-box">

        <div class="logo">
            🎓 EduHub
        </div>

        <div class="subtitle">
            College Marketplace
        </div>

        <h2>
            Create Account
        </h2>

        <div id="statusMessage"></div>

        <form id="signupForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="College Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                minlength="6"
                required
            >

            <button
                type="submit"
                id="signupButton"
            >
                Create Account
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </p>

        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Marketplace
        </a>

    </div>

</div>


<script>

const API =
    "https://eduhub-backend-llwi.onrender.com";


const form =
    document.getElementById("signupForm");

const button =
    document.getElementById("signupButton");

const statusMessage =
    document.getElementById("statusMessage");


// ==========================================
// SHOW MESSAGE
// ==========================================

function showMessage(message, type) {

    statusMessage.innerText = message;

    statusMessage.className = type;

}


// ==========================================
// SIGNUP
// ==========================================

form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const name =
        document.getElementById("name")
            .value
            .trim();


    const email =
        document.getElementById("email")
            .value
            .trim();


    const password =
        document.getElementById("password")
            .value
            .trim();


    // Validation

    if (!name || !email || !password) {

        showMessage(
            "Please fill all fields.",
            "error"
        );

        return;
    }


    if (password.length < 6) {

        showMessage(
            "Password must contain at least 6 characters.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.innerText =
        "Creating Account...";


    try {

        const response =
            await fetch(
                `${API}/api/signup`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        name: name,

                        email: email,

                        password: password

                    })
                }
            );


        let data = {};

        try {

            data =
                await response.json();

        } catch {

            data = {};

        }


        if (!response.ok) {

            showMessage(
                data.message ||
                "Unable to create account.",
                "error"
            );

            button.disabled = false;

            button.innerText =
                "Create Account";

            return;
        }


        showMessage(
            "Account created successfully! Redirecting to login...",
            "success"
        );


        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 1200);


    } catch (error) {

        console.error(
            "Signup Error:",
            error
        );


        showMessage(
            "Unable to connect to EduHub backend.",
            "error"
        );


        button.disabled = false;

        button.innerText =
            "Create Account";

    }

});

</script>

</body>
</html>
