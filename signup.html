
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduHub - Sign Up</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #312e81,
                #4f46e5
            );

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 35px 30px;
            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.2);

            text-align: center;
        }

        .login-box h1 {
            margin: 0;
            color: #312e81;
            font-size: 30px;
        }

        .login-box > p {
            color: #666;
            margin-top: 5px;
        }

        .login-box h2 {
            margin-top: 25px;
            color: #333;
        }

        #signupForm {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        #signupForm input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 9px;

            font-size: 14px;
            outline: none;
        }

        #signupForm input:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 2px
                rgba(79,70,229,0.1);
        }

        #signupForm button {
            border: none;

            background: #4f46e5;
            color: white;

            padding: 13px;
            border-radius: 9px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            margin-top: 5px;
        }

        #signupForm button:hover {
            background: #4338ca;
        }

        #signupForm button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .signup-text {
            margin-top: 20px;
            color: #666;
        }

        .signup-text a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            display: block;
            margin-top: 18px;

            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #4f46e5;
        }

        .status-message {
            display: none;

            padding: 11px;
            border-radius: 8px;

            margin-bottom: 15px;

            font-size: 14px;
            text-align: center;
        }

        .status-error {
            display: block;
            background: #fee2e2;
            color: #dc2626;
        }

        .status-success {
            display: block;
            background: #dcfce7;
            color: #15803d;
        }

    </style>

</head>


<body>

<div class="login-container">

    <div class="login-box">

        <h1>
            🎓 EduHub
        </h1>

        <p>
            College Marketplace
        </p>

        <h2>
            Create Account
        </h2>


        <div id="statusMessage"
             class="status-message">
        </div>


        <form id="signupForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="College Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                minlength="6"
                required
            >

            <button
                type="submit"
                id="signupButton"
            >
                Create Account
            </button>

        </form>


        <p class="signup-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Marketplace
        </a>

    </div>

</div>


<script>

const API =
    "https://eduhub-backend-llwi.onrender.com";


const form =
    document.getElementById("signupForm");


const button =
    document.getElementById("signupButton");


const statusMessage =
    document.getElementById("statusMessage");


function showMessage(message, type) {

    statusMessage.innerText = message;

    statusMessage.className =
        "status-message " +
        (
            type === "success"
            ? "status-success"
            : "status-error"
        );
}


form.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        if (!name || !email || !password) {

            showMessage(
                "Please fill all fields.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }


        button.disabled = true;

        button.innerText =
            "Creating Account...";


        try {

            const response =
                await fetch(
                    `${API}/signup`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password
                        })
                    }
                );


            let data = {};

            try {
                data = await response.json();
            } catch (error) {
                data = {};
            }


            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Unable to create account.",
                    "error"
                );

                button.disabled = false;

                button.innerText =
                    "Create Account";

                return;
            }


            showMessage(
                "Account created successfully! Redirecting...",
                "success"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                1200
            );


        } catch (error) {

            console.error(
                "Signup error:",
                error
            );


            showMessage(
                "Unable to connect to EduHub backend. Please try again.",
                "error"
            );


            button.disabled = false;

            button.innerText =
                "Create Account";
        }

    }
);

</script>

</body>

</html>
